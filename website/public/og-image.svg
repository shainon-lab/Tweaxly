<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1428"/>
      <stop offset="1" stop-color="#06091a"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#A78BFA" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="950" cy="160" r="320" fill="url(#glow)"/>
  <circle cx="200" cy="520" r="280" fill="url(#glow)" opacity="0.6"/>

  <!-- TWEA X LY wordmark -->
  <g transform="translate(80, 230)">
    <text x="0" y="80" font-family="-apple-system, system-ui, Inter, Arial, sans-serif" font-size="120" font-weight="700" fill="white" letter-spacing="14">TWEA</text>
    <!-- Split X (purple + teal chevrons meeting at center) -->
    <g transform="translate(420, 0)">
      <polyline points="20,8 96,68 20,128" fill="none" stroke="#A78BFA" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
      <polyline points="172,8 96,68 172,128" fill="none" stroke="#22D3EE" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="620" y="80" font-family="-apple-system, system-ui, Inter, Arial, sans-serif" font-size="120" font-weight="700" fill="white" letter-spacing="14">LY</text>
  </g>

  <!-- Tagline -->
  <text x="80" y="430" font-family="-apple-system, system-ui, Inter, Arial, sans-serif" font-size="38" font-weight="500" fill="#cbd5e1" letter-spacing="6">
    AI&#160;&#160;F I N A N C I A L&#160;&#160;I N T E L L I G E N C E
  </text>

  <!-- Sub-tagline -->
  <text x="80" y="500" font-family="-apple-system, system-ui, Inter, Arial, sans-serif" font-size="28" fill="#94a3b8">
    Forecasting · Business Signals · AI Advisory · Real-Time Insights
  </text>

  <!-- Bottom accent stripe -->
  <rect x="0" y="610" width="1200" height="4" fill="url(#brand)"/>
</svg>
